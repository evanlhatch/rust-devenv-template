# cargo-deny config — run: cargo deny check (pre-commit hook + just deny).

[advisories]
version = 2
yanked = "deny"

[bans]
# Error handling — fast-observe only, never thiserror/anyhow/eyre.
deny = [
    { name = "thiserror", deny = true },
    { name = "anyhow", deny = true },
    { name = "eyre", deny = true },
]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "LGPL-2.0",
    "LGPL-3.0",
    "AGPL-3.0",
    "EUPL-1.2",
    "SSPL-1.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "allow"
