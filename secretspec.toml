# SecretSpec — declarative secrets, provisioned per environment.
# Load at runtime: `secretspec run -- <cmd>` (never exported to the shell).
# Provider chain: dotenv (local dev) <-> infisical (team). See
# https://secretspec.dev for the full reference.

[project]
name = "myproj"
revision = "1.0"

[providers]
# Local dev: repo-root .env (gitignored). Zero setup.
default = "dotenv://.env"
# Team: Infisical. Swap in your project UUID + env slug:
#   infisical = "infisical://app.infisical.com/PROJECT_UUID?env=dev"
# Auth: INFISICAL_CLIENT_ID/INFISICAL_CLIENT_SECRET (machine identity) or
# INFISICAL_TOKEN.
infisical = "infisical://app.infisical.com/PROJECT_UUID?env=dev"

# 1Password — common in real projects, disabled here by default.
# Uncomment + use your vault name; it doubles as the git credential store:
#   git config --global credential.helper secretspec
# (git-credential-secretspec ships with SecretSpec 0.20+; until then the
# bundled devenv secretspec has no git helper — use `op` for git creds.)
# onepassword = "onepassword://Production"

[profiles.default]
# Placeholder so devenv eval succeeds with zero real secrets. Delete once
# the project declares its own.
EXAMPLE_TOKEN = { description = "placeholder — replace with real secrets", required = false }

# [profiles.production]
# DATABASE_URL = { description = "PostgreSQL connection string", providers = ["infisical"] }
