# SecretSpec — declarative secrets, provisioned per environment.
# Load at runtime: `secretspec run -- <cmd>` (never exported to the shell).
# Machine identity lives OUT of this file — in the OS keyring (see below).

[project]
name = "myproj"
revision = "1.0"

[providers]
# Local dev: repo-root .env (gitignored). Zero setup.
default = "dotenv://.env"

# Team: Infisical. The project UUID is not secret — commit it. The machine
# identity stays OUT of the repo: store it per-machine in the keyring with
#   secretspec config provider login infisical
# (falls back to INFISICAL_CLIENT_ID / INFISICAL_CLIENT_SECRET env vars).
[providers.infisical]
uri = "infisical://app.infisical.com/PROJECT_UUID?env=dev"
credentials = { client_id = "keyring", client_secret = "keyring" }

# 1Password — common in real projects, disabled here by default.
# Uncomment + use your vault name; it doubles as the git credential store
# (git-credential-secretspec ships with SecretSpec 0.20+; until then use
# `op` for git creds).
# onepassword = "onepassword://Production"

[profiles.default]
# Placeholder so devenv eval succeeds with zero real secrets. Delete once
# the project declares its own.
EXAMPLE_TOKEN = { description = "placeholder — replace with real secrets", required = false }

# User-global config (0.17+): `secretspec config global init` declares
# machine-wide provider aliases/defaults once, shared across projects.

# [profiles.production]
# DATABASE_URL = { description = "PostgreSQL connection string", providers = ["infisical"] }
