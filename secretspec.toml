# SecretSpec — secrets your app needs, provisioned per environment.
# Declare here; provide via the provider (devenv.yaml: dotenv = .env at
# repo root, gitignored). Load at runtime: `secretspec run -- <cmd>`.
[project]
name = "myproj"
revision = "1.0"

[providers]
default = "dotenv://.env"

[profiles.default]
# Placeholder so devenv eval succeeds with zero real secrets. Delete once
# the project declares its own.
EXAMPLE_TOKEN = { description = "placeholder — replace with real secrets", required = false }
