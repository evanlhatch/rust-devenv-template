inputs:
    nixpkgs:
        url: github:cachix/devenv-nixpkgs/rolling
    git-hooks:
        url: github:cachix/git-hooks.nix
        inputs:
            nixpkgs:
                follows: nixpkgs
    rust-overlay:
        url: github:oxalica/rust-overlay
        inputs:
            nixpkgs:
                follows: nixpkgs
    ncro:
        url: github:feel-co/ncro
        inputs:
            nixpkgs:
                follows: nixpkgs

# Enforce a recent CLI: `.envrc` eval-cache + `devenv hook` need >= 2.1.
require_version: ">=2.2"

# SecretSpec: secrets declared in secretspec.toml (see that file for
# providers). Load at RUNTIME via `secretspec run -- <cmd>` — never export
# into the shell env. dotenv = repo-root .env (gitignored).
secretspec:
    enable: true
    provider: dotenv
    profile: default
